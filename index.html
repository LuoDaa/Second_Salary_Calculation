<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打工牛 · 实时工资计算器</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700;800&display=swap");

*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#090d14;
  --panel:#101722;
  --panel-2:#151e2b;
  --panel-3:#0d131d;
  --line:rgba(255,255,255,.10);
  --line-2:rgba(255,255,255,.16);
  --text:#f5f7fb;
  --muted:#8f9bad;
  --soft:#c5cfdd;
  --green:#28e08f;
  --green-2:#7ef8c4;
  --amber:#ffbe55;
  --red:#ff6b73;
  --cyan:#61d8ff;
  --purple:#9c8cff;
  --shadow:0 24px 80px rgba(0,0,0,.42),0 2px 16px rgba(0,0,0,.28);
  --radius:22px;
  --radius-sm:14px;
}

html{min-height:100%}
body{
  min-height:100vh;
  overflow-x:hidden;
  color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 16% 8%,rgba(40,224,143,.20),transparent 28%),
    radial-gradient(circle at 84% 2%,rgba(255,190,85,.18),transparent 30%),
    radial-gradient(circle at 70% 82%,rgba(156,140,255,.14),transparent 32%),
    linear-gradient(135deg,#06080e 0%,#0d121c 48%,#080b10 100%);
  -webkit-font-smoothing:antialiased;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.35;
  background-image:
    linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:48px 48px;
  mask-image:linear-gradient(to bottom,rgba(0,0,0,.9),transparent 78%);
}

button,input{font:inherit}
button{border:0}
.app{
  position:relative;
  z-index:1;
  width:min(1120px,100%);
  min-height:100vh;
  margin:0 auto;
  padding:22px 16px 34px;
}

.topbar{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:18px;
  margin-bottom:20px;
}

.brand{display:flex;align-items:center;gap:14px}
.mark{
  width:46px;
  height:46px;
  display:grid;
  place-items:center;
  border:1px solid rgba(255,255,255,.18);
  border-radius:15px;
  color:#06110c;
  background:linear-gradient(135deg,var(--green-2),var(--amber));
  box-shadow:0 16px 42px rgba(40,224,143,.18);
  font-size:26px;
  font-weight:900;
}
.title h1{font-size:1.55rem;font-weight:900;letter-spacing:0;line-height:1.1}
.title p{margin-top:5px;color:var(--muted);font-size:.9rem}
.clock{
  min-width:154px;
  padding:12px 14px;
  border:1px solid var(--line);
  border-radius:16px;
  background:rgba(16,23,34,.7);
  text-align:right;
  box-shadow:0 12px 36px rgba(0,0,0,.18);
}
.clock b{display:block;font-family:"JetBrains Mono",monospace;font-size:1rem}
.clock span{color:var(--muted);font-size:.73rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}

.layout{
  display:block;
}

.panel{
  border:1px solid var(--line);
  border-radius:var(--radius);
  background:linear-gradient(180deg,rgba(21,30,43,.92),rgba(13,19,29,.92));
  box-shadow:var(--shadow);
  backdrop-filter:blur(22px);
}
.settings{padding:22px}
.settings{
  width:min(540px,100%);
  margin:34px auto 0;
}
.settings.off{display:none}
.section-label{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
  color:var(--soft);
  font-size:.78rem;
  font-weight:800;
  letter-spacing:.12em;
  text-transform:uppercase;
}
.section-label::after{
  content:"";
  width:74px;
  height:1px;
  background:linear-gradient(90deg,rgba(255,255,255,.22),transparent);
}
.field{margin-bottom:16px}
.field label{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:8px;
  color:var(--soft);
  font-size:.84rem;
  font-weight:700;
}
.hint{color:var(--muted);font-size:.72rem;font-weight:600}
.input{
  width:100%;
  height:48px;
  padding:0 14px;
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  outline:0;
  color:var(--text);
  background:rgba(255,255,255,.055);
  font-family:"JetBrains Mono",monospace;
  font-size:1rem;
  font-weight:700;
  transition:border-color .18s,box-shadow .18s,background .18s;
}
.input:focus{
  border-color:rgba(97,216,255,.55);
  background:rgba(255,255,255,.075);
  box-shadow:0 0 0 4px rgba(97,216,255,.10);
}
.input::placeholder{color:#586476}
.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.choice input{display:none}
.choice label{
  display:grid;
  place-items:center;
  min-height:42px;
  cursor:pointer;
  border:1px solid var(--line);
  border-radius:13px;
  color:var(--muted);
  background:rgba(255,255,255,.045);
  font-size:.86rem;
  font-weight:800;
  transition:.18s;
}
.choice input:checked+label{
  color:#07110d;
  border-color:transparent;
  background:linear-gradient(135deg,var(--green-2),var(--amber));
  box-shadow:0 12px 30px rgba(40,224,143,.16);
}
.cta{
  width:100%;
  min-height:50px;
  margin-top:6px;
  cursor:pointer;
  border-radius:15px;
  color:#06110c;
  background:linear-gradient(135deg,var(--green-2),var(--amber));
  font-size:1rem;
  font-weight:900;
  box-shadow:0 18px 46px rgba(40,224,143,.18);
  transition:transform .18s,filter .18s,box-shadow .18s;
}
.cta:hover{transform:translateY(-1px);filter:saturate(1.08);box-shadow:0 22px 58px rgba(40,224,143,.22)}
.cta:active{transform:translateY(0)}
.cta.stop{
  color:#fff;
  background:linear-gradient(135deg,#ff6b73,#b63dff);
  box-shadow:0 18px 44px rgba(255,107,115,.18);
}

.ticker{display:none}
.ticker.on{display:block}
.ticker-grid{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(420px,470px);
  gap:16px;
  align-items:stretch;
}

.scene{
  position:relative;
  order:2;
  min-height:642px;
  margin-bottom:0;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:var(--radius);
  background:
    radial-gradient(circle at 50% 28%,rgba(40,224,143,.18),transparent 34%),
    radial-gradient(circle at 76% 16%,rgba(255,190,85,.16),transparent 22%),
    linear-gradient(180deg,#101724 0%,#0a111b 62%,#070a10 100%);
  box-shadow:var(--shadow);
  perspective:980px;
}
.scene::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(90deg,transparent 0 49%,rgba(255,255,255,.04) 49% 51%,transparent 51%),
    linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:76px 100%,100% 36px;
  mask-image:linear-gradient(to bottom,transparent,black 25%,transparent 82%);
}
.city{
  position:absolute;
  inset:auto 0 148px;
  height:130px;
  opacity:.5;
  z-index:0;
  background:
    linear-gradient(to top,rgba(255,255,255,.08) 0 54%,transparent 54%) 4% 100%/42px 118px no-repeat,
    linear-gradient(to top,rgba(255,255,255,.06) 0 64%,transparent 64%) 14% 100%/56px 96px no-repeat,
    linear-gradient(to top,rgba(255,255,255,.08) 0 70%,transparent 70%) 80% 100%/50px 122px no-repeat,
    linear-gradient(to top,rgba(255,255,255,.05) 0 58%,transparent 58%) 92% 100%/62px 106px no-repeat;
}
.floor{
  position:absolute;
  left:50%;
  bottom:-42px;
  width:116%;
  height:220px;
  transform:translateX(-50%) rotateX(70deg);
  transform-origin:center top;
  background:
    linear-gradient(90deg,rgba(97,216,255,.14) 1px,transparent 1px),
    linear-gradient(rgba(97,216,255,.12) 1px,transparent 1px);
  background-size:58px 58px;
  opacity:.64;
  z-index:0;
}
.coin{
  position:absolute;
  width:34px;
  height:34px;
  border-radius:50%;
  background:linear-gradient(135deg,#fff0a4,#ffbe55 55%,#c87520);
  box-shadow:0 8px 22px rgba(255,190,85,.22);
  opacity:.86;
  animation:coinFloat 6.5s ease-in-out infinite;
  z-index:1;
}
.coin::after{content:"¥";display:grid;place-items:center;height:100%;color:#69420d;font-weight:900}
.coin.c1{top:92px;left:11%;animation-delay:-1.5s}
.coin.c2{top:120px;right:12%;transform:scale(.78);animation-delay:-3.8s}
.coin.c3{top:40px;right:28%;transform:scale(.62);animation-delay:-.5s}
@keyframes coinFloat{0%,100%{translate:0 0;rotate:y 0deg}50%{translate:0 -18px;rotate:y 180deg}}

.desk-3d{
  position:absolute;
  left:50%;
  bottom:72px;
  width:330px;
  height:96px;
  transform:translateX(-50%) rotateX(58deg) rotateZ(-1deg);
  transform-style:preserve-3d;
  border-radius:20px;
  background:linear-gradient(135deg,#263244,#121a27);
  box-shadow:0 30px 64px rgba(0,0,0,.42);
  z-index:1;
  opacity:.72;
}
.desk-3d::before{
  content:"";
  position:absolute;
  inset:8px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:16px;
}
.desk-3d::after{
  content:"";
  position:absolute;
  left:26px;
  right:26px;
  bottom:-30px;
  height:36px;
  border-radius:0 0 18px 18px;
  background:linear-gradient(180deg,#131b28,#0a0f17);
  transform:translateZ(-24px);
}
.monitor{
  position:absolute;
  left:26%;
  bottom:290px;
  width:150px;
  height:94px;
  transform:translateX(-50%) rotateX(3deg) rotateZ(-3deg);
  border:1px solid rgba(255,255,255,.18);
  border-radius:18px;
  background:linear-gradient(180deg,#263348,#111923);
  box-shadow:0 24px 54px rgba(0,0,0,.38);
  z-index:1;
  opacity:.76;
}
.monitor::before{
  content:"";
  position:absolute;
  inset:10px;
  border-radius:12px;
  background:
    linear-gradient(90deg,rgba(40,224,143,.18),transparent),
    repeating-linear-gradient(0deg,rgba(97,216,255,.14) 0 2px,transparent 2px 9px);
  animation:scan 2.2s linear infinite;
}
.monitor::after{
  content:"";
  position:absolute;
  left:48px;
  right:48px;
  bottom:-34px;
  height:34px;
  background:linear-gradient(180deg,#1b2635,#0d141e);
  clip-path:polygon(30% 0,70% 0,100% 100%,0 100%);
}
@keyframes scan{0%{background-position:0 -40px}100%{background-position:0 40px}}

.cow-canvas{
  position:absolute;
  inset:0;
  z-index:3;
  width:100%;
  height:100%;
}
.speech{
  position:absolute;
  left:50%;
  top:64px;
  z-index:4;
  min-width:96px;
  padding:8px 11px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:14px;
  color:#06110c;
  background:linear-gradient(135deg,var(--green-2),#fff0a4);
  font-size:.78rem;
  font-weight:900;
  white-space:nowrap;
  opacity:0;
  transform:translate(26px,8px) scale(.9);
  transition:.2s;
  box-shadow:0 14px 34px rgba(0,0,0,.24);
}
.speech.sh{opacity:1;transform:translate(26px,0) scale(1)}

.money-panel{padding:20px}
.money-panel{
  order:1;
  min-height:642px;
  display:flex;
  flex-direction:column;
}
.money-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  margin-bottom:14px;
}
.badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 12px;
  border:1px solid rgba(40,224,143,.24);
  border-radius:999px;
  color:var(--green-2);
  background:rgba(40,224,143,.10);
  font-size:.78rem;
  font-weight:900;
}
.badge::before{
  content:"";
  width:8px;
  height:8px;
  border-radius:50%;
  background:currentColor;
  box-shadow:0 0 18px currentColor;
  animation:pulse 1.1s ease-in-out infinite;
}
.badge.o{color:var(--red);border-color:rgba(255,107,115,.25);background:rgba(255,107,115,.10)}
.badge.wk{color:var(--amber);border-color:rgba(255,190,85,.25);background:rgba(255,190,85,.10)}
@keyframes pulse{50%{opacity:.4;scale:.72}}
.money{
  position:relative;
  padding:34px 0 22px;
}
.glow{
  position:absolute;
  inset:auto 0 2px;
  text-align:center;
  color:var(--green);
  font-family:"JetBrains Mono",monospace;
  font-size:4.7rem;
  font-weight:900;
  opacity:.16;
  filter:blur(22px);
  pointer-events:none;
}
.amount{
  position:relative;
  display:flex;
  align-items:baseline;
  justify-content:center;
  gap:3px;
  min-height:118px;
}
.currency{color:var(--green-2);font-size:2rem;font-weight:900}
.main-num{
  font-family:"JetBrains Mono",monospace;
  font-size:5.25rem;
  font-weight:900;
  letter-spacing:0;
  line-height:.98;
}
.decimal{
  color:var(--green-2);
  font-family:"JetBrains Mono",monospace;
  font-size:2.65rem;
  font-weight:900;
}
.mills{
  color:var(--muted);
  font-family:"JetBrains Mono",monospace;
  font-size:1rem;
  font-weight:800;
}
.bump{animation:bump .14s ease-out}
@keyframes bump{50%{transform:scale(1.035);color:var(--amber)}}
.rate{
  text-align:center;
  color:var(--muted);
  font-family:"JetBrains Mono",monospace;
  font-size:.88rem;
}
.rate b{color:var(--green-2)}
.progress{margin-top:22px}
.progress-row{
  display:flex;
  justify-content:space-between;
  margin-bottom:9px;
  color:var(--muted);
  font-size:.78rem;
  font-weight:800;
}
.progress-row b{color:var(--cyan);font-family:"JetBrains Mono",monospace}
.moneybag-track{
  position:relative;
  height:48px;
  padding:18px 56px 0 16px;
  border:1px solid rgba(255,190,85,.22);
  border-radius:18px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.025)),
    radial-gradient(circle at 14% 28%,rgba(255,190,85,.18),transparent 30%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 16px 34px rgba(0,0,0,.16);
}
.bag-rail{
  position:relative;
  height:12px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.12);
  border-radius:999px;
  background:rgba(255,255,255,.07);
}
.fill{
  width:0%;
  height:100%;
  border-radius:inherit;
  background:linear-gradient(90deg,var(--cyan),var(--green-2),var(--amber));
  box-shadow:0 0 22px rgba(40,224,143,.32);
  transition:width .45s ease-out;
}
.moneybag{
  position:absolute;
  right:12px;
  bottom:7px;
  width:42px;
  height:43px;
  transform-origin:50% 100%;
  filter:drop-shadow(0 12px 18px rgba(0,0,0,.28));
  animation:bagBob 2.4s ease-in-out infinite;
}
.moneybag::before{
  content:"";
  position:absolute;
  left:12px;
  top:0;
  width:18px;
  height:12px;
  border:2px solid #6c420d;
  border-bottom:0;
  border-radius:10px 10px 0 0;
  background:linear-gradient(#fff1b0,#ffcc63);
}
.moneybag::after{
  content:"¥";
  position:absolute;
  left:4px;
  right:4px;
  bottom:0;
  height:35px;
  display:grid;
  place-items:center;
  border:2px solid #6c420d;
  border-radius:16px 16px 18px 18px;
  color:#6c420d;
  background:linear-gradient(145deg,#fff1a8 0%,#ffbd43 58%,#d48018 100%);
  font-weight:900;
}
.coin-stack{
  position:absolute;
  left:18px;
  top:-9px;
  display:flex;
  gap:5px;
  opacity:.95;
}
.coin-stack i{
  width:13px;
  height:13px;
  border-radius:50%;
  background:linear-gradient(135deg,#fff4b8,#ffbd43);
  box-shadow:0 4px 10px rgba(255,190,85,.2);
}
@keyframes bagBob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-4px) rotate(3deg)}}
.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:auto;
  padding-top:24px;
}
.stat{
  min-height:82px;
  padding:13px;
  border:1px solid var(--line);
  border-radius:16px;
  background:rgba(255,255,255,.045);
}
.stat strong{
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
  color:var(--text);
  font-family:"JetBrains Mono",monospace;
  font-size:1.02rem;
  font-weight:900;
  white-space:nowrap;
}
.stat span{
  display:block;
  margin-top:6px;
  color:var(--muted);
  font-size:.7rem;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
}
.chrono{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:14px;
}
.timebox{
  display:grid;
  place-items:center;
  min-height:74px;
  border:1px solid var(--line);
  border-radius:16px;
  background:linear-gradient(180deg,rgba(97,216,255,.08),rgba(255,255,255,.035));
}
.timebox b{font-family:"JetBrains Mono",monospace;font-size:1.34rem}
.timebox span{margin-top:4px;color:var(--muted);font-size:.68rem;font-weight:800}
.stop-wrap{margin-top:18px}

.particles{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  overflow:hidden;
}
.reminder-toast{
  position:fixed;
  right:22px;
  bottom:22px;
  z-index:20;
  display:none;
  width:min(330px,calc(100vw - 28px));
  padding:14px 16px;
  border:1px solid rgba(126,248,196,.32);
  border-radius:18px;
  color:#07110d;
  background:linear-gradient(135deg,var(--green-2),#fff0a4);
  box-shadow:0 24px 70px rgba(0,0,0,.38);
}
.reminder-toast.show{display:block;animation:toastIn .25s ease-out}
.reminder-toast b{display:block;margin-bottom:4px;font-size:.95rem;font-weight:900}
.reminder-toast span{font-size:.82rem;font-weight:800}
.reminder-toast button{position:absolute;right:9px;top:8px;border:0;border-radius:9px;background:rgba(0,0,0,.12);padding:3px 8px;color:#07110d;font-weight:900;cursor:pointer}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.particle{
  position:absolute;
  color:var(--amber);
  font-family:"JetBrains Mono",monospace;
  font-size:.86rem;
  font-weight:900;
  opacity:0;
  animation:fall 3.4s ease-in forwards;
}
@keyframes fall{
  0%{opacity:.92;transform:translateY(-24px) rotate(0)}
  100%{opacity:0;transform:translateY(100vh) rotate(42deg)}
}

@media(max-width:980px){
  .app{width:min(560px,100%)}
  .ticker-grid{display:flex;flex-direction:column}
  .scene{order:1;min-height:420px;margin-bottom:0}
  .money-panel{order:2;min-height:0}
  .main-num{font-size:4.2rem}
}
@media(max-width:560px){
  .app{padding:20px 14px 30px}
  .topbar{align-items:stretch;flex-direction:column}
  .clock{text-align:left}
  .title h1{font-size:1.32rem}
  .main-num{font-size:3.3rem}
  .decimal{font-size:1.9rem}
  .currency{font-size:1.45rem}
  .amount{min-height:72px}
  .scene{order:1;min-height:360px;margin-bottom:0}
  .money-panel{order:2;min-height:0}
  .monitor{width:132px;height:82px;bottom:132px}
  .desk-3d{width:270px;bottom:54px}
  .stats{grid-template-columns:1fr}
  .choice-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="particles" id="particles"></div>
<div class="reminder-toast" id="reminderToast"><button onclick="dismissReminder()">×</button><b id="reminderTitle">该喝水了</b><span id="reminderText">站起来活动一下，眼睛休息 2 分钟。</span></div>
<main class="app">
  <header class="topbar">
    <div class="brand">
      <div class="mark">牛</div>
      <div class="title">
        <h1>打工牛 · 实时工资</h1>
        <p>盯住每一秒现金流，工作日自动计算。</p>
      </div>
    </div>
    <div class="clock">
      <b id="clockTime">--:--:--</b>
      <span id="clockDate">Today</span>
    </div>
  </header>

  <section class="layout">
    <form class="panel settings" id="settingsPanel" onsubmit="event.preventDefault();toggleTicker();">
      <div class="section-label">薪资参数</div>
      <div class="field">
        <label for="salary">月薪 <span class="hint">人民币 / 月</span></label>
        <input class="input" id="salary" type="number" min="0" step="100" autocomplete="off">
      </div>
      <div class="field">
        <label for="startTime">上班时间</label>
        <input class="input" id="startTime" type="time" value="09:00">
      </div>
      <div class="field">
        <label for="endTime">下班时间</label>
        <input class="input" id="endTime" type="time" value="18:00">
      </div>
      <div class="field">
        <label>休息制度</label>
        <div class="choice-grid">
          <div class="choice"><input type="radio" name="restDay" id="restDouble" value="double" checked><label for="restDouble">双休</label></div>
          <div class="choice"><input type="radio" name="restDay" id="restSingle" value="single"><label for="restSingle">单休</label></div>
          <div class="choice"><input type="radio" name="restDay" id="restNone" value="none"><label for="restNone">无休</label></div>
        </div>
      </div>
      <button class="cta" type="submit">开始赚钱</button>
    </form>

    <section class="ticker" id="tickerPanel">
      <div class="ticker-grid">
        <div class="scene" aria-label="3D 打工牛动画">
          <div class="city"></div>
          <div class="coin c1"></div>
          <div class="coin c2"></div>
          <div class="coin c3"></div>
          <div class="floor"></div>
          <div class="monitor"></div>
          <div class="desk-3d"></div>
          <canvas class="cow-canvas" id="cowCanvas"></canvas>
          <div class="speech" id="speech">+¥0.01</div>
        </div>

        <div class="panel money-panel">
          <div class="money-head">
            <div class="section-label" style="margin:0">今日收益</div>
            <span class="badge" id="statusBadge">计算中</span>
          </div>

          <div class="money">
            <div class="glow" id="moneyGlow">¥0</div>
            <div class="amount">
              <span class="currency">¥</span>
              <span class="main-num" id="moneyInt">0</span>
              <span class="decimal" id="moneyDec">.00</span>
              <span class="mills" id="moneyMil">00</span>
            </div>
          </div>
          <div class="rate">每秒 <b id="perSecond">0.000000</b> 元</div>

          <div class="progress">
            <div class="progress-row"><span>上班进度</span><b id="progressText">0%</b></div>
            <div class="moneybag-track" aria-label="钱袋子进度条">
              <div class="coin-stack"><i></i><i></i><i></i></div>
              <div class="bag-rail"><div class="fill" id="progressFill"></div></div>
              <div class="moneybag"></div>
            </div>
          </div>

          <div class="stats">
            <div class="stat"><strong id="perMinute">¥0.00</strong><span>每分钟</span></div>
            <div class="stat"><strong id="perHour">¥0.00</strong><span>每小时</span></div>
            <div class="stat"><strong id="todayTotal">¥0.00</strong><span>今日总额</span></div>
            <div class="stat"><strong id="monthSalary">¥0</strong><span>月薪</span></div>
          </div>

          <div class="chrono">
            <div class="timebox"><b id="elapsedHour">0</b><span>小时</span></div>
            <div class="timebox"><b id="elapsedMinute">0</b><span>分钟</span></div>
            <div class="timebox"><b id="elapsedSecond">0</b><span>秒</span></div>
          </div>

          <div class="stop-wrap"><button class="cta stop" onclick="toggleTicker()">停止</button></div>
        </div>
      </div>
    </section>
  </section>
</main>

<script>
document.documentElement.dataset.cowScript="boot";
(async()=>{
const THREE = await import("./vendor/three.module.js?v=3");
const { GLTFLoader } = await import("./vendor/GLTFLoader.js?v=3");
window.__cowModuleStarted=true;
document.documentElement.dataset.cowScript="module-loaded";

const canvas=document.getElementById("cowCanvas");
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(32,1,.1,100);
camera.position.set(4.8,1.25,8.6);
const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setClearColor(0x000000,0);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;

const stage=new THREE.Group();
scene.add(stage);

const cowRoot=new THREE.Group();
cowRoot.position.set(-.05,-.78,.1);
cowRoot.rotation.set(0,-.68,0);
stage.add(cowRoot);

const gold=new THREE.MeshPhysicalMaterial({color:0xffc75a,roughness:.24,metalness:.24,clearcoat:.35});
const glass=new THREE.MeshPhysicalMaterial({color:0x76f3c3,roughness:.2,transparent:true,opacity:.18,clearcoat:.9});
const floorMat=new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.24});

const floorShadow=new THREE.Mesh(new THREE.CircleGeometry(1.7,64),floorMat);
floorShadow.position.set(0,-1.18,.05);
floorShadow.rotation.x=-Math.PI/2;
stage.add(floorShadow);

const coinGroup=new THREE.Group();
stage.add(coinGroup);
for(const [x,y,z,s] of [[-1.65,.65,.15,.72],[1.65,.9,.0,.58],[.85,1.75,-.15,.5]]) {
  const c=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,.055,48),gold);
  c.position.set(x,y,z);
  c.scale.setScalar(s);
  c.rotation.x=Math.PI/2;
  coinGroup.add(c);
}

const orbit=new THREE.Mesh(new THREE.TorusGeometry(1.5,.01,10,128),glass);
orbit.position.set(0,-.18,.05);
orbit.rotation.x=Math.PI/2;
stage.add(orbit);

scene.add(new THREE.HemisphereLight(0xdff7ff,0x151821,2.25));
const key=new THREE.DirectionalLight(0xffffff,2.55);
key.position.set(3.8,4.5,5.2);
scene.add(key);
const rim=new THREE.PointLight(0x61d8ff,1.65,9);
rim.position.set(-3.2,1.6,2.8);
scene.add(rim);
const warm=new THREE.PointLight(0xffbe55,1.25,7);
warm.position.set(2.4,2.4,2.1);
scene.add(warm);

let cowModel=null;
let cowMixer=null;
let clipActions={};
let currentClip=null;
let modelReady=false;
window.__cowModelReady=false;
window.__cowLoadStatus={state:"starting"};

const cowLoader=new GLTFLoader();
cowLoader.load(
  "./vendor/Cow.gltf?v=2",
  (gltf)=>{
    cowModel=gltf.scene;
    const box=new THREE.Box3().setFromObject(cowModel);
    const size=box.getSize(new THREE.Vector3());
    const center=box.getCenter(new THREE.Vector3());
    cowModel.position.sub(center);
    const scale=2.35/Math.max(size.x,size.y,size.z);
    cowModel.scale.setScalar(scale);
    cowModel.traverse((node)=>{
      if(node.isMesh){
        node.castShadow=false;
        node.receiveShadow=false;
        if(node.material){
          node.material.roughness=Math.min(node.material.roughness ?? .5,.62);
          node.material.needsUpdate=true;
        }
      }
    });
    cowRoot.add(cowModel);
    if(gltf.animations.length){
      cowMixer=new THREE.AnimationMixer(cowModel);
      clipActions=Object.fromEntries(gltf.animations.map((clip)=>[clip.name,cowMixer.clipAction(clip)]));
      playCowClip("Idle", .18);
    }
    modelReady=true;
    window.__cowModelReady=true;
    window.__cowLoadStatus={state:"ready",animations:gltf.animations.length};
    document.documentElement.dataset.cowScript="model-ready";
  },
  (event)=>{
    window.__cowLoadStatus={
      state:"loading",
      loaded:event.loaded||0,
      total:event.total||0
    };
  },
  (error)=>{
    window.__cowLoadStatus={state:"error",message:String(error && (error.message || error))};
    console.error("Cow model failed to load", error);
  }
);

let activeAction="";
let actionUntil=0;
function playCowClip(name, fade=.12){
  const next=clipActions[name] || clipActions.Idle;
  if(!next || next===currentClip) return;
  next.reset().fadeIn(fade).play();
  if(currentClip) currentClip.fadeOut(fade);
  currentClip=next;
}
window.cow3DAction=(action)=>{
  activeAction=action;
  actionUntil=performance.now()+1900;
  if(action==="drk") playCowClip("Eating");
  if(action==="str") playCowClip("Idle_Headlow");
  if(action==="wve") playCowClip("Walk");
};

function resize(){
  const rect=canvas.getBoundingClientRect();
  const width=Math.max(1,Math.floor(rect.width));
  const height=Math.max(1,Math.floor(rect.height));
  renderer.setSize(width,height,false);
  camera.aspect=width/height;
  camera.updateProjectionMatrix();
  camera.lookAt(0,-.32,0);
}
window.addEventListener("resize",resize);
new ResizeObserver(resize).observe(canvas.parentElement);
window.resizeCow3D=resize;
resize();

function animate(now){
  const t=now/1000;
  if(now>actionUntil){
    activeAction="";
    playCowClip("Idle", .22);
  }
  cowRoot.position.y=-.78+Math.sin(t*2.1)*.035;
  cowRoot.rotation.y=-.68+Math.sin(t*.65)*.13;
  cowRoot.rotation.z=Math.sin(t*1.35)*.015;
  cowRoot.scale.setScalar(1);

  if(activeAction==="drk") cowRoot.rotation.z=.08+Math.sin(t*8)*.035;
  if(activeAction==="str") cowRoot.scale.set(1,1.045,1);
  if(activeAction==="wve") cowRoot.rotation.y=-.68+Math.sin(t*12)*.18;

  coinGroup.children.forEach((coin,index)=>{
    coin.rotation.z=t*(1.7+index*.35);
    coin.position.y=[.65,.9,1.75][index]+Math.sin(t*2.2+index)*.06;
  });
  orbit.rotation.z=t*.22;
  if(cowMixer) cowMixer.update(.016);
  renderer.render(scene,camera);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
})().catch((error)=>{
  window.__cowLoadStatus={state:"module-error",message:String(error && (error.message || error))};
  document.documentElement.dataset.cowScript="module-error";
  console.error("3D scene failed", error);
});
</script>

<script>
let isRunning=false;
let timerId;
let particleTimer;
let config={};
let lastMoney="";
let actionTick=0;
let lastReminder=Number(localStorage.getItem("salaryTickerLastReminder")||0);

const moneyBits=["+¥0.01","+¥0.08","+¥0.18","+¥0.66"];
const cowActions=["drk","str","wve"];
const cowMessages=["继续搬砖","+¥0.01","摸鱼暂停","咖啡续命","绩效到账","快下班了","老板看不见"];

function yuan(value, digits=2){
  return "¥"+Number(value||0).toLocaleString("zh-CN",{minimumFractionDigits:digits,maximumFractionDigits:digits});
}

function updateClock(){
  const now=new Date();
  document.getElementById("clockTime").textContent=now.toLocaleTimeString("zh-CN",{hour12:false});
  document.getElementById("clockDate").textContent=now.toLocaleDateString("zh-CN",{weekday:"long",month:"2-digit",day:"2-digit"});
}
setInterval(updateClock,1000);
updateClock();

function workDays(){
  const value=document.querySelector('input[name="restDay"]:checked').value;
  if(value==="double") return 22;
  if(value==="single") return 26;
  return 30;
}

function parseMinutes(value){
  const parts=value.split(":").map(Number);
  return parts[0]*60+parts[1];
}

function calculateConfig(){
  const salary=parseFloat(document.getElementById("salary").value)||0;
  const start=parseMinutes(document.getElementById("startTime").value);
  let end=parseMinutes(document.getElementById("endTime").value);
  if(end<=start) end+=1440;
  const workMinutes=end-start;
  const days=workDays();
  const perSecond=salary/days/workMinutes/60;
  config={
    salary,
    start,
    end,
    workMinutes,
    days,
    perSecond,
    perMinute:salary/days/workMinutes,
    perHour:salary/days/(workMinutes/60)
  };
}

function statusNow(){
  const now=new Date();
  const day=now.getDay();
  const minute=now.getHours()*60+now.getMinutes();
  if(config.days===22&&(day===0||day===6)) return {state:"wk",label:"周末休息中"};
  if(config.days===26&&day===0) return {state:"wk",label:"周末休息中"};
  if(minute<config.start) return {state:"o",label:"还没上班"};
  if(config.end>1440){
    if(minute>=config.end-1440 && minute<config.start) return {state:"o",label:"已经下班"};
  }else if(minute>=config.end){
    return {state:"o",label:"已经下班"};
  }
  return {state:"w",label:"努力搬砖中"};
}

function elapsedSeconds(){
  const now=new Date();
  let seconds=now.getHours()*3600+now.getMinutes()*60+now.getSeconds();
  const start=config.start*60;
  let end=config.end*60;
  if(end<=start) end+=86400;
  if(config.end>1440 && seconds<start) seconds+=86400;
  if(seconds<start) return 0;
  if(seconds>=end) return end-start;
  return seconds-start;
}

function setMoney(value){
  const fixed=Math.max(0,value).toFixed(4);
  if(fixed===lastMoney) return;
  const [intPart,decimalPart]=fixed.split(".");
  const intText=Number(intPart).toLocaleString("zh-CN");
  const dec=decimalPart.slice(0,2);
  const mil=decimalPart.slice(2,4);
  const moneyInt=document.getElementById("moneyInt");
  const moneyDec=document.getElementById("moneyDec");
  moneyInt.textContent=intText;
  moneyDec.textContent="."+dec;
  document.getElementById("moneyMil").textContent=mil;
  document.getElementById("moneyGlow").textContent="¥"+intText;
  moneyInt.classList.add("bump");
  moneyDec.classList.add("bump");
  setTimeout(()=>{moneyInt.classList.remove("bump");moneyDec.classList.remove("bump")},140);
  lastMoney=fixed;
}

function showSpeech(text){
  const speech=document.getElementById("speech");
  speech.textContent=text;
  speech.classList.add("sh");
  setTimeout(()=>speech.classList.remove("sh"),1800);
}

function cowAnimate(){
  actionTick++;
  if(actionTick%120!==0) return;
  const action=cowActions[Math.floor(Math.random()*cowActions.length)];
  if(window.cow3DAction) window.cow3DAction(action);
  showSpeech(cowMessages[Math.floor(Math.random()*cowMessages.length)]);
}

function createParticle(){
  if(!isRunning) return;
  const particle=document.createElement("div");
  particle.className="particle";
  particle.textContent=moneyBits[Math.floor(Math.random()*moneyBits.length)];
  particle.style.left=Math.random()*100+"%";
  particle.style.animationDuration=(2.2+Math.random()*2.2)+"s";
  particle.style.color=Math.random()>.45?"var(--amber)":"var(--green-2)";
  document.getElementById("particles").appendChild(particle);
  setTimeout(()=>particle.remove(),4600);
}

function updateTicker(){
  const status=statusNow();
  const badge=document.getElementById("statusBadge");
  badge.className="badge "+(status.state==="w"?"":status.state);
  badge.textContent=status.label;

  const elapsed=elapsedSeconds();
  const earned=status.state==="wk" ? 0 : elapsed*config.perSecond;
  const totalSeconds=config.workMinutes*60;
  const progress=Math.min(100,Math.max(0,elapsed/totalSeconds*100));

  setMoney(earned);
  document.getElementById("perSecond").textContent=config.perSecond.toFixed(6);
  document.getElementById("progressFill").style.width=progress+"%";
  document.getElementById("progressText").textContent=progress.toFixed(1)+"%";
  document.getElementById("perMinute").textContent=yuan(config.perMinute);
  document.getElementById("perHour").textContent=yuan(config.perHour);
  document.getElementById("todayTotal").textContent=yuan(config.salary/config.days);
  document.getElementById("monthSalary").textContent=yuan(config.salary,0);
  document.getElementById("elapsedHour").textContent=Math.floor(elapsed/3600);
  document.getElementById("elapsedMinute").textContent=Math.floor(elapsed%3600/60);
  document.getElementById("elapsedSecond").textContent=elapsed%60;

  if(Math.random()<.18) createParticle();
  cowAnimate();
  checkReminder();
}

function dismissReminder(){
  document.getElementById("reminderToast").classList.remove("show");
}

function showReminder(){
  const items=[
    ["该喝水了","补一杯水，顺手活动一下肩颈。"],
    ["眼睛休息","看远处 20 秒，别一直盯屏幕。"],
    ["起来走走","站起来走两步，腰背会感谢你。"],
    ["休息一下","休息 2 分钟，再继续搬砖。"]
  ];
  const item=items[Math.random()*items.length|0];
  document.getElementById("reminderTitle").textContent=item[0];
  document.getElementById("reminderText").textContent=item[1];
  document.getElementById("reminderToast").classList.add("show");
  showSpeech(item[0]);
  if("Notification" in window && Notification.permission==="granted") new Notification(item[0],{body:item[1]});
  if("Notification" in window && Notification.permission==="default") Notification.requestPermission();
}

function checkReminder(){
  const now=Date.now();
  const interval=60*60*1000;
  if(now-lastReminder>=interval){
    lastReminder=now;
    localStorage.setItem("salaryTickerLastReminder",String(now));
    showReminder();
  }
}

function toggleTicker(){
  if(!isRunning){
    const salaryInput=document.getElementById("salary");
    const salary=parseFloat(salaryInput.value);
    if(!salary||salary<=0){
      salaryInput.focus();
      salaryInput.style.borderColor="var(--red)";
      salaryInput.style.boxShadow="0 0 0 4px rgba(255,107,115,.13)";
      setTimeout(()=>{salaryInput.style.borderColor="";salaryInput.style.boxShadow=""},1500);
      return;
    }
    calculateConfig();
    isRunning=true;
    lastMoney="";
    actionTick=0;
    document.getElementById("settingsPanel").classList.add("off");
    document.getElementById("tickerPanel").classList.add("on");
    setTimeout(()=>window.resizeCow3D&&window.resizeCow3D(),0);
    showSpeech("开工赚钱");
    updateTicker();
    timerId=setInterval(updateTicker,100);
    particleTimer=setInterval(()=>{if(Math.random()<.55) createParticle()},1700);
  }else{
    isRunning=false;
    clearInterval(timerId);
    clearInterval(particleTimer);
    document.getElementById("settingsPanel").classList.remove("off");
    document.getElementById("tickerPanel").classList.remove("on");
  }
}

document.addEventListener("keydown",(event)=>{
  if(event.key==="Enter"&&!isRunning) toggleTicker();
  if(event.key==="Escape"&&isRunning) toggleTicker();
});

const demoParams=new URLSearchParams(location.search);
if(demoParams.get("demo")==="1"){
  document.getElementById("salary").value=demoParams.get("salary")||"20000";
  setTimeout(toggleTicker,350);
}
</script>
</body>
</html>
